<!doctype html>
<html lang=\"en\">
<head><meta charset=\"utf-8\" /><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" /><title>Login • RankingGen</title>
<style>body{margin:0;font-family:Inter,sans-serif;background:radial-gradient(circle at top,#111827,#05060a);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;} .card{width:92vw;max-width:420px;padding:24px;border-radius:24px;background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 40px rgba(0,0,0,.25);} input,button{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;margin-top:10px;} button{background:linear-gradient(90deg,#4f46e5,#06b6d4);border:none;cursor:pointer;} a{color:#67e8f9;} .error{color:#fda4af;margin-top:10px;}</style></head>
<body><div class=\"card\"><h2 style=\"margin-top:0\">RankingGen</h2><p>Sign in to generate Shorts locally.</p><form method=\"post\"><input name=\"username\" placeholder=\"Username\" /><input name=\"password\" type=\"password\" placeholder=\"Password\" /><button>Login</button></form><p><a href=\"/signup\">Create an account</a></p>{% if error %}<div class=\"error\">{{error}}</div>{% endif %}</div></body></html>
